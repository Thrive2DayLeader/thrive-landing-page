<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Continue to checkout · THRIVE</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #060F22;
    color: #F7F3EC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 520px;
    padding: 32px;
    text-align: center;
  }
  a { color: #C9A961; }
</style>
</head>
<body>
<main>
  <h1>Continue to checkout</h1>
  <p>Use the link below to continue your enrollment.</p>
  <p><a id="checkoutLink" href="/thrive-enroll.html">Continue to enrollment</a></p>
</main>
<script>
const checkouts = {
  "6865580": "https://sso.teachable.com/secure/2704529/checkout/6865580/thrive-business-launch-accelerator-life-coaching-program1?product_id=6865580",
  "6771179": "https://sso.teachable.com/secure/2704529/checkout/6771179/thrive-business-launch-accelerator-life-coaching-program1?product_id=6771179",
  "6771171": "https://sso.teachable.com/secure/2704529/checkout/6771171/thrive-business-launch-accelerator-life-coaching-program1?product_id=6771171",
  "6772141": "https://sso.teachable.com/secure/2704529/checkout/6772141/thrive-business-launch-accelerator-life-coaching-program?product_id=6772141"
};

const productId = new URLSearchParams(window.location.search).get("product_id");
const target = checkouts[productId] || "/thrive-enroll.html";
const checkoutLink = document.getElementById("checkoutLink");
checkoutLink.href = target;
if (checkouts[productId]) {
  checkoutLink.textContent = "Continue to secure checkout";
}
// Keep this page manual: Teachable may return visitors here, so an automatic
// redirect could create a loop between the school domain and this page.
</script>
</body>
</html>
