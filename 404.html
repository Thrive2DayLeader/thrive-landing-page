<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #060F22;
    color: #F7F3EC;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    max-width: 520px;
    padding: 32px;
    text-align: center;
  }
  a { color: #C9A961; }
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p id="message">Taking you back to THRIVE.</p>
  <p><a id="fallbackLink" href="/thrive-enroll.html">Return to enrollment</a></p>
</main>
<script>
const checkouts = {
  "6771171": "https://sso.teachable.com/secure/2704529/checkout/6771171/thrive-business-launch-accelerator-life-coaching-program1?product_id=6771171",
  "6772141": "https://sso.teachable.com/secure/2704529/checkout/6772141/thrive-business-launch-accelerator-life-coaching-program?product_id=6772141"
};

const params = new URLSearchParams(window.location.search);
const productId = params.get("product_id");
const checkout = checkouts[productId];

if (window.location.pathname.replace(/\/$/, "") === "/purchase" && checkout) {
  document.getElementById("message").textContent = "Redirecting to checkout...";
  document.getElementById("fallbackLink").href = checkout;
  window.location.replace(checkout);
} else {
  window.location.replace("/thrive-enroll.html");
}
</script>
</body>
</html>
